<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Vallis WMS</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0f1117;--sf:#1a1d27;--br:#2a2d3a;--tx:#e8eaf0;--mt:#6b7280;--gn:#22c55e;--rd:#ef4444;--yw:#f59e0b;--bl:#3b82f6;--gbg:#052e16;--rbg:#2d0a0a;--ybg:#2d1a00}body{background:var(--bg);color:var(--tx);font-family:-apple-system,sans-serif;min-height:100vh}.screen{display:none;min-height:100vh;flex-direction:column}.screen.active{display:flex}.header{background:var(--sf);border-bottom:1px solid var(--br);padding:14px 16px;display:flex;align-items:center;gap:12px}.hl{width:32px;height:32px;background:var(--bl);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}.ht{font-size:16px;font-weight:600}.hs{font-size:12px;color:var(--mt)}.hb{margin-left:auto;background:none;border:1px solid var(--br);color:var(--tx);padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer}.content{flex:1;padding:16px}.card{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:12px}.ct{font-size:13px;color:var(--mt);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}.oi{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer}.oi:active{border-color:var(--bl)}.on{font-size:15px;font-weight:600}.om{font-size:13px;color:var(--mt);margin-top:4px}.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}.kb{background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer}.kb.complete{border-color:var(--gn);background:var(--gbg)}.kn{font-size:18px;font-weight:700}.ks{font-size:11px;color:var(--mt);margin-top:2px}.kb.complete .ks{color:var(--gn)}.si{width:100%;background:var(--bg);border:2px solid var(--bl);border-radius:12px;padding:14px 16px;font-size:16px;color:var(--tx)}.si:focus{outline:none}.rb{border-radius:12px;padding:16px;margin-bottom:12px;display:none}.rb.show{display:block}.r-ok{background:var(--gbg);border:1px solid var(--gn)}.r-wrong{background:var(--rbg);border:1px solid var(--rd)}.r-dup{background:var(--ybg);border:1px solid var(--yw)}.ri{font-size:28px;margin-bottom:6px}.rt{font-size:15px;font-weight:600}.rs{font-size:13px;color:var(--mt);margin-top:4px}.pr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--br)}.pr:last-child{border-bottom:none}.pc{width:22px;height:22px;border-radius:50%;border:2px solid var(--br);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px}.pc.done{background:var(--gn);border-color:var(--gn)}.pn{flex:1;font-size:14px}.pn.done{color:var(--mt);text-decoration:line-through}.pcd{font-size:11px;color:var(--mt);font-family:monospace}.cb{background:var(--gbg);border:2px solid var(--gn);border-radius:12px;padding:20px;text-align:center;margin-bottom:12px;display:none}.cb.show{display:block}.ci{font-size:40px;margin-bottom:8px}.ctl{font-size:18px;font-weight:700;color:var(--gn)}.cs{font-size:13px;color:var(--mt);margin-top:4px}.btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:8px}.btn-p{background:var(--bl);color:#fff}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.stat{background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:12px;text-align:center}.sn{font-size:22px;font-weight:700}.sl{font-size:11px;color:var(--mt);margin-top:2px}.empty{text-align:center;padding:40px 20px;color:var(--mt)}.loading{text-align:center;padding:40px;color:var(--mt)}.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}.bg{background:var(--gbg);color:var(--gn)}.by{background:var(--ybg);color:var(--yw)}.pb{height:4px;background:var(--br);border-radius:2px;overflow:hidden}.pf{height:100%;background:var(--gn);border-radius:2px;transition:width .3s}input,select{width:100%;background:var(--bg);border:1px solid var(--br);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;margin-bottom:8px}input:focus,select:focus{outline:none;border-color:var(--bl)}</style></head><body>
<div id="so" class="screen active"><div class="header"><div class="hl">V</div><div><div class="ht">Vallis WMS</div><div class="hs">Контроль комплектации</div></div></div><div class="content"><div class="card"><div class="ct">Новый заказ</div><select id="nom"><option value="">Выберите модель...</option></select><input id="nok" type="number" placeholder="Количество комплектов" min="1" max="200"><button class="btn btn-p" onclick="createOrder()">Создать заказ</button></div><div class="ct" style="margin-bottom:8px">Активные заказы</div><div id="ol"><div class="loading">Загрузка...</div></div></div></div>
<div id="sk" class="screen"><div class="header"><div class="hl">V</div><div><div class="ht" id="kt">Заказ</div><div class="hs" id="ksb"></div></div><button class="hb" onclick="showOrders()">&#8592; Назад</button></div><div class="content"><div class="stats"><div class="stat"><div class="sn" id="st">0</div><div class="sl">Всего</div></div><div class="stat"><div class="sn" style="color:var(--gn)" id="sd">0</div><div class="sl">Готово</div></div><div class="stat"><div class="sn" style="color:var(--yw)" id="sl2">0</div><div class="sl">Осталось</div></div></div><div class="ct" style="margin-bottom:8px">Выберите комплект</div><div id="kg" class="kg"></div></div></div>
<div id="ss" class="screen"><div class="header"><div class="hl">V</div><div><div class="ht" id="scti">Комплект</div><div class="hs" id="scs"></div></div><button class="hb" onclick="showKits()">&#8592; Назад</button></div><div class="content"><div class="cb" id="cb"><div class="ci">&#9989;</div><div class="ctl">Комплект полный!</div><div class="cs">Все детали проверены — можно грузить</div></div><div id="rb" class="rb"><div class="ri" id="rri"></div><div class="rt" id="rrt"></div><div class="rs" id="rrs"></div></div><div class="card" style="margin-bottom:12px"><div class="ct">Сканировать деталь</div><input id="sci" class="si" placeholder="Сканируйте QR пистолетом..." autocomplete="off" autocorrect="off" spellcheck="false"></div><div class="card"><div class="ct">Список деталей <span id="pt" style="color:var(--tx);font-weight:600"></span></div><div class="pb" style="margin-bottom:12px"><div class="pf" id="pf" style="width:0%"></div></div><div id="pcl"></div></div></div></div>
<script>
const API="https://vallis-wms-production.up.railway.app";
let co=null,ck=null,ap=[];
async function api(p,m,b){m=m||"GET";const o={method:m,headers:{"Content-Type":"application/json"}};if(b)o.body=JSON.stringify(b);return(await fetch(API+p,o)).json();}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");}
async function showOrders(){show("so");const r=await Promise.all([api("/api/orders"),api("/api/models")]);const orders=r[0],models=r[1];document.getElementById("nom").innerHTML="<option value=''>Выберите модель...</option>"+models.map(m=>"<option value='"+m.id+"'>"+m.name+"</option>").join("");const list=document.getElementById("ol");if(!orders.length){list.innerHTML="<div class='empty'>Нет заказов. Создайте первый выше.</div>";return;}list.innerHTML=orders.map(o=>"<div class='oi' onclick='showKitsForOrder("+o.id+")'><div style='display:flex;align-items:center;justify-content:space-between'><div class='on'>"+o.order_number+"</div><span class='badge "+(o.status==="complete"?"bg":"by")+"'>"+(o.status==="complete"?"Готов":"В работе")+"</span></div><div class='om'>"+o.model_name+" &middot; "+o.total_kits+" комплектов</div></div>").join("");}
async function createOrder(){const model=document.getElementById("nom").value,kits=document.getElementById("nok").value;if(!model||!kits){alert("Заполните все поля");return;}await api("/api/orders","POST",{model_id:parseInt(model),total_kits:parseInt(kits)});document.getElementById("nok").value="";showOrders();}
async function showKitsForOrder(id){const orders=await api("/api/orders");co=orders.find(o=>o.id===id);show("sk");document.getElementById("kt").textContent=co.order_number;document.getElementById("ksb").textContent=co.model_name;const grid=document.getElementById("kg");grid.innerHTML="<div class='loading'>Загрузка...</div>";const kd=await Promise.all(Array.from({length:co.total_kits},function(_,i){return api("/api/orders/"+id+"/kits/"+(i+1));}));const done=kd.filter(k=>k.kit.status==="complete").length;document.getElementById("st").textContent=co.total_kits;document.getElementById("sd").textContent=done;document.getElementById("sl2").textContent=co.total_kits-done;grid.innerHTML=kd.map(function(k,i){return "<div class='kb "+(k.kit.status==="complete"?"complete":"")+"' onclick='showScan("+id+","+(i+1)+")'><div class='kn'>"+(i+1)+"</div><div class='ks'>"+(k.kit.status==="complete"?"Готов":k.progress+"/"+k.total)+"</div></div>";}).join("");}
function showKits(){showKitsForOrder(co.id);}
async function showScan(oid,kn){const data=await api("/api/orders/"+oid+"/kits/"+kn);ck=data.kit;ap=data.parts;show("ss");document.getElementById("scti").textContent="Комплект "+kn;document.getElementById("scs").textContent=co.order_number+" / "+co.model_name;document.getElementById("cb").classList.toggle("show",data.kit.status==="complete");renderCL(data.parts,data.progress,data.total);document.getElementById("rb").classList.remove("show");const inp=document.getElementById("sci");inp.value="";inp.onchange=null;inp.addEventListener("change",onScan);setTimeout(function(){inp.focus();},100);}
function renderCL(parts,prog,total){var pct=total>0?Math.round(prog/total*100):0;document.getElementById("pf").style.width=pct+"%";document.getElementById("pt").textContent=prog+"/"+total;document.getElementById("pcl").innerHTML=parts.map(function(p){return "<div class='pr'><div class='pc "+(p.scanned?"done":"")+"'>"+(p.scanned?"v":"")+"</div><div><div class='pn "+(p.scanned?"done":"")+"'>"+p.part_name+"</div><div class='pcd'>"+p.part_code+"</div></div></div>";}).join("");}
async function onScan(e){const code=e.target.value.trim();if(!code)return;e.target.value="";const res=await api("/api/scan","POST",{kit_id:ck.id,part_code:code});if(res.result==="ok"){showR("r-ok","OK",res.part_name,res.progress+" из "+res.total+" деталей");ap=ap.map(function(p){return p.part_code===code?Object.assign({},p,{scanned:true}):p;});renderCL(ap,res.progress,res.total);if(res.kit_complete)document.getElementById("cb").classList.add("show");}else if(res.result==="wrong"){showR("r-wrong","ЧУЖАЯ",res.message);}else{showR("r-dup","ДУБЛИКАТ",res.message);}setTimeout(function(){document.getElementById("sci").focus();},100);}
function showR(cls,text,sub){const b=document.getElementById("rb");b.className="rb show "+cls;document.getElementById("rri").textContent=text==="OK"?"✓":text==="ЧУЖАЯ"?"✗":"!";document.getElementById("rrt").textContent=text;document.getElementById("rrs").textContent=sub;setTimeout(function(){b.classList.remove("show");},4000);}
showOrders();
</script></body></html>
